<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="António Torres">
<title>António Torres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed photograph as a "window"; name and menu sit quietly on a thin top scrim. */
  :root {
    --bg: #0e0f0d;
    --ink: #f4f3ef;
    --ink-dim: rgba(244, 243, 239, 0.72);
    --scrim: rgba(10, 11, 9, 0.38);
    --panel: rgba(14, 15, 13, 0.58);
    --line: rgba(244, 243, 239, 0.22);
    --icon: rgba(226, 225, 220, 0.82);
    --f-name: "Newsreader", "Iowan Old Style", Georgia, serif;
    --f-ui: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
    --gutter: clamp(16px, 3vw, 36px);
    color-scheme: dark;
  }
  /* "hidden" must always win over component display rules (e.g. #about uses display: grid). */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #stage, #fallback {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }
  #stage { opacity: 0; transition: opacity 900ms ease; }
  #stage.ready { opacity: 1; }
  #fallback { background: var(--bg) center / cover no-repeat; }

  .scrim {
    position: fixed; left: 0; right: 0; top: 0;
    height: calc(140px + env(safe-area-inset-top, 0px));
    background: linear-gradient(to bottom, var(--scrim), transparent);
    pointer-events: none;
  }

  header {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + var(--gutter)) var(--gutter) 0;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px 24px;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.35);
    pointer-events: none;
  }
  header > * { pointer-events: auto; }

  .name {
    margin: 0;
    font-family: var(--f-name);
    font-weight: 400;
    font-size: clamp(1.25rem, 1rem + 0.9vw, 1.6rem);
    letter-spacing: 0.005em;
    line-height: 1.1;
  }

  nav ul {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 4px clamp(16px, 2.2vw, 26px);
  }
  nav li { display: flex; align-items: center; }
  nav li:first-child { margin-right: clamp(4px, 1vw, 10px); }

  /* Logos are masks filled with a token colour: all the same grey, white on hover. */
  .icon-link {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 28px;
    border-bottom: 0 !important;
  }
  .mark {
    display: block;
    background-color: var(--icon);
    -webkit-mask: var(--src) center / contain no-repeat;
    mask: var(--src) center / contain no-repeat;
    filter: drop-shadow(0 1px 5px rgba(0, 0, 0, 0.35));
    transition: background-color 200ms ease, transform 200ms ease;
  }
  .icon-link:hover .mark, .icon-link:focus-visible .mark {
    background-color: var(--ink);
    transform: translateY(-1px);
  }
  @media (prefers-reduced-motion: reduce) {
    .icon-link:hover .mark, .icon-link:focus-visible .mark { transform: none; }
  }
  nav a, nav button {
    font: 500 0.75rem/1 var(--f-ui);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: none; border: 0; padding: 6px 0; cursor: pointer;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 200ms ease, border-color 200ms ease;
  }
  nav a:hover, nav button:hover, nav button[aria-expanded="true"] {
    color: var(--ink); border-bottom-color: var(--line);
  }
  nav a:focus-visible, nav button:focus-visible, .close:focus-visible {
    outline: 1px solid var(--ink); outline-offset: 4px; border-radius: 1px;
  }

  #about {
    position: fixed;
    left: var(--gutter);
    bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gutter));
    max-width: min(360px, calc(100% - 2 * var(--gutter)));
    padding: 20px 22px 18px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    backdrop-filter: blur(14px) saturate(1.1);
    border: 1px solid var(--line);
    border-radius: 2px;
    display: grid; gap: 10px;
  }
  #about h2 {
    margin: 0;
    font: 500 0.7rem/1 var(--f-ui);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  #about p {
    margin: 0;
    font-family: var(--f-name);
    font-size: 1.05rem; line-height: 1.5;
    text-wrap: pretty;
  }
  .close {
    position: absolute; top: 12px; right: 12px;
    width: 28px; height: 28px;
    background: none; border: 0; cursor: pointer;
    color: var(--ink-dim); font: 400 1.1rem/1 var(--f-ui);
  }
  .close:hover { color: var(--ink); }

  #loading {
    position: fixed; right: var(--gutter);
    bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gutter));
    font: 500 0.7rem/1 var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-dim);
  }

  @media (max-width: 480px) {
    nav a, nav button { font-size: 0.7rem; letter-spacing: 0.1em; }
  }
</style>
</head>
<body>


<div id="fallback" hidden></div>
<canvas id="stage" aria-label="Photograph of a living room opening onto a balcony and green hillside"></canvas>
<div class="scrim"></div>

<header>
  <h1 class="name" id="site-name">António Torres</h1>
  <nav aria-label="Main">
    <ul>
      <li><button type="button" id="about-btn" aria-expanded="false" aria-controls="about">About</button></li>
    </ul>
  </nav>
</header>

<section id="about" hidden aria-labelledby="about-title">
  <button type="button" class="close" id="about-close" aria-label="Close">&times;</button>
  <h2 id="about-title">About</h2>
  <p id="about-text"></p>
</section>

<div id="loading">Loading</div>

<script>
/* ================= CONFIG: edit here ================= */
const CONFIG = {
  scene: "scene/",           // folder made by tools/build_scene.py from the photo
  imageAlt: "Photograph of a living room opening onto a balcony and green hillside",
  about: "Senior QA Engineer. Coimbra, Portugal.",
  // Menu links, shown after "About" in this order
  // icon: white-on-transparent PNG/SVG used as a mask, so the colour comes from the CSS
  // size: icon height in px, tuned so the four marks look the same visual weight
  links: [
    { label: "LinkedIn",    url: "https://www.linkedin.com/in/antoniot0rres/", icon: "icon-linkedin.png",   size: 17 },
    { label: "Instagram",   url: "https://www.instagram.com/antoniot0rres/",   icon: "icon-instagram.png",  size: 17 },
    { label: "Erro Crasso", url: "https://errocrasso.cc/",                     icon: "icon-errocrasso.png", size: 12 },
    { label: "allroutes",   url: "https://allroutes.app/",                     icon: "icon-allroutes.png",  size: 19 }
  ],
  strength: 0.034,           // effect intensity (0.02 subtle, 0.034 strong; scene is built for up to 0.045)
  focus: 0.55,               // depth that stays still (the window frame plane)
  verticalRatio: 0.55,       // vertical movement relative to horizontal
  idleDrift: true            // gentle motion when nobody touches the mouse
};
/* ===================================================== */

document.getElementById("about-text").textContent = CONFIG.about;
(() => {
  const ul = document.querySelector("nav ul");
  for (const { label, url, icon, size } of CONFIG.links) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener";
    a.className = "icon-link";
    a.setAttribute("aria-label", label);
    a.title = label;
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.setAttribute("aria-hidden", "true");
    mark.style.height = size + "px";
    mark.style.setProperty("--src", `url("${icon}")`);
    // Width follows the icon's own proportions once its size is known.
    const probe = new Image();
    probe.onload = () => { mark.style.width = (size * probe.naturalWidth / probe.naturalHeight) + "px"; };
    probe.src = icon;
    mark.style.width = size + "px";
    a.appendChild(mark);
    li.appendChild(a);
    ul.appendChild(li);
  }
})();
document.getElementById("stage").setAttribute("aria-label", CONFIG.imageAlt);

/* About panel */
(() => {
  const btn = document.getElementById("about-btn");
  const panel = document.getElementById("about");
  const close = document.getElementById("about-close");
  const set = (open) => {
    panel.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
    if (open) close.focus();
  };
  btn.addEventListener("click", () => set(panel.hidden));
  close.addEventListener("click", () => { set(false); btn.focus(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) { set(false); btn.focus(); } });
})();

/* Window-parallax renderer.
   The scene is a set of planar regions (see tools/build_scene.py). When the eye moves, each region
   moves as a rigid plane, which is an affine map: straight lines stay straight, nothing bends.
   Where a near region slides away, the surface hidden behind it is shown from the fill images.
   A depth buffer makes the nearest surface win at every pixel.
   Pass 1 draws the regions into an offscreen texture; pass 2 copies it to the screen and closes
   the sub-pixel seams between neighbouring planes with the colour of the covered pixels around. */
(() => {
  const canvas = document.getElementById("stage");
  const loading = document.getElementById("loading");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const base = CONFIG.scene.replace(/\/?$/, "/");
  const gl = canvas.getContext("webgl", { antialias: false, depth: false, premultipliedAlpha: false });

  const showFallback = () => {
    const fb = document.getElementById("fallback");
    fb.style.backgroundImage = `url("${base}image.jpg")`;
    fb.hidden = false;
    canvas.hidden = true;
    loading.hidden = true;
  };
  if (!gl) { showFallback(); return; }

  /* ---------- pass 1: planar regions ---------- */
  const sceneVS = `
    attribute vec2 aCorner;
    uniform vec4 uBox;        // region bounding box in source uv (u0, v0, u1, v1), v down
    uniform vec3 uPlane;      // depth = a*u + b*v + c   (1 = near, 0 = far)
    uniform vec2 uOffset;     // eye offset in uv units
    uniform float uFocus;     // depth that does not move
    uniform vec2 uView;       // cover-fit scale from image uv to screen
    varying vec2 vSrc;
    void main() {
      vec2 s = mix(uBox.xy, uBox.zw, aCorner);
      float d = dot(uPlane, vec3(s, 1.0));
      vec2 p = s + uOffset * (d - uFocus);       // affine in s: lines stay lines
      vec2 scr = (p - 0.5) * uView + 0.5;
      gl_Position = vec4(scr.x * 2.0 - 1.0, 1.0 - scr.y * 2.0, clamp(0.5 - 0.8 * d, -0.98, 0.98), 1.0);
      vSrc = s;
    }`;
  const sceneFS = `
    precision highp float;
    uniform sampler2D uImg;
    uniform sampler2D uFill1;
    uniform sampler2D uFill2;
    uniform sampler2D uFill3;
    uniform sampler2D uLab;   // R: region, G: hidden 1, B: hidden 2
    uniform sampler2D uLab2;  // R: hidden 3
    uniform float uId;
    varying vec2 vSrc;
    void main() {
      if (vSrc.x < 0.0 || vSrc.y < 0.0 || vSrc.x > 1.0 || vSrc.y > 1.0) discard;
      vec3 L = floor(texture2D(uLab, vSrc).rgb * 255.0 + 0.5);
      if (L.r == uId) { gl_FragColor = vec4(texture2D(uImg, vSrc).rgb, 1.0); return; }
      if (L.g == uId) { gl_FragColor = vec4(texture2D(uFill1, vSrc).rgb, 1.0); return; }
      if (L.b == uId) { gl_FragColor = vec4(texture2D(uFill2, vSrc).rgb, 1.0); return; }
      if (floor(texture2D(uLab2, vSrc).r * 255.0 + 0.5) == uId) {
        gl_FragColor = vec4(texture2D(uFill3, vSrc).rgb, 1.0); return;
      }
      discard;
    }`;

  /* ---------- pass 2: copy to screen, close seams ---------- */
  const compVS = `
    attribute vec2 aCorner;
    varying vec2 vUv;
    void main() { vUv = aCorner; gl_Position = vec4(aCorner * 2.0 - 1.0, 0.0, 1.0); }`;
  const compFS = `
    precision highp float;
    uniform sampler2D uScene;
    uniform sampler2D uImg;
    uniform vec2 uTexel;
    uniform vec2 uView;
    uniform vec2 uOffset;
    uniform float uFocus;
    varying vec2 vUv;
    void main() {
      vec4 c = texture2D(uScene, vUv);
      if (c.a > 0.5) { gl_FragColor = vec4(c.rgb, 1.0); return; }
      // Uncovered pixel (a seam between two planes): average the covered pixels around it.
      vec4 acc = vec4(0.0);
      for (int r = 1; r <= 4; r++) {
        float fr = float(r);
        for (int i = 0; i < 8; i++) {
          float a = float(i) * 0.785398;
          vec4 t = texture2D(uScene, vUv + vec2(cos(a), sin(a)) * fr * uTexel);
          acc += vec4(t.rgb * t.a, t.a);
        }
        if (acc.a > 0.0) break;
      }
      if (acc.a > 0.0) { gl_FragColor = vec4(acc.rgb / acc.a, 1.0); return; }
      // Larger gap (should not happen): the photo on the far plane.
      vec2 scr = vec2(vUv.x, 1.0 - vUv.y);
      vec2 s = (scr - 0.5) / uView + 0.5 + uOffset * uFocus;
      gl_FragColor = vec4(texture2D(uImg, clamp(s, 0.0, 1.0)).rgb, 1.0);
    }`;

  const compile = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  const link = (vsrc, fsrc) => {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsrc));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsrc));
    gl.bindAttribLocation(p, 0, "aCorner");
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  };

  let sceneProg, compProg;
  try {
    sceneProg = link(sceneVS, sceneFS);
    compProg = link(compVS, compFS);
  } catch (err) { console.error(err); showFallback(); return; }

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const uniforms = (p, names) => Object.fromEntries(names.map((n) => [n, gl.getUniformLocation(p, n)]));
  const su = uniforms(sceneProg, ["uBox", "uPlane", "uOffset", "uFocus", "uView", "uId",
    "uImg", "uFill1", "uFill2", "uFill3", "uLab", "uLab2"]);
  const cu = uniforms(compProg, ["uScene", "uImg", "uTexel", "uView", "uOffset", "uFocus"]);

  // Colour textures are filtered; label textures must be read exactly (no filtering, no colour
  // management), otherwise region ids blend at borders.
  gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  const makeTex = (unit, im, exact) => {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im);
    const f = exact ? gl.NEAREST : gl.LINEAR;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  };

  // Offscreen target for pass 1 (colour + depth), resized with the canvas.
  const SCENE_UNIT = 6;
  const fbo = gl.createFramebuffer();
  const fboTex = gl.createTexture();
  const fboDepth = gl.createRenderbuffer();
  let fboW = 0, fboH = 0;
  const sizeTarget = (w, h) => {
    if (w === fboW && h === fboH) return true;
    fboW = w; fboH = h;
    gl.activeTexture(gl.TEXTURE0 + SCENE_UNIT);
    gl.bindTexture(gl.TEXTURE_2D, fboTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindRenderbuffer(gl.RENDERBUFFER, fboDepth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, fboDepth);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return ok;
  };

  const loadImg = (src) => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error("Could not load " + src));
    im.src = src;
  });

  const strength = CONFIG.strength * (reduced ? 0.5 : 1);
  // Zoom in just enough that the shifted picture never reveals its edges.
  const zoom = 1 + strength * 1.35;

  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(canvas.clientWidth * dpr);
    const h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    return sizeTarget(canvas.width, canvas.height);
  };

  /* Pointer: position on screen maps to the viewer's eye position in front of the window. */
  const target = { x: 0, y: 0 };
  const cur = { x: 0, y: 0 };
  let lastInput = -1e9;
  const fromEvent = (e) => {
    target.x = (e.clientX / window.innerWidth) * 2 - 1;
    target.y = (e.clientY / window.innerHeight) * 2 - 1;
    lastInput = performance.now();
  };
  window.addEventListener("pointermove", fromEvent, { passive: true });
  window.addEventListener("pointerdown", fromEvent, { passive: true });
  document.addEventListener("pointerleave", () => { target.x = 0; target.y = 0; });
  window.addEventListener("blur", () => { target.x = 0; target.y = 0; });

  const files = ["image.jpg", "fill1.jpg", "fill2.jpg", "fill3.jpg", "labels.png", "labels2.png"];
  Promise.all([
    fetch(base + "layers.json").then((r) => { if (!r.ok) throw new Error("Could not load layers.json"); return r.json(); }),
    ...files.map((f) => loadImg(base + f))
  ]).then(([scene, img, f1, f2, f3, lab, lab2]) => {
    makeTex(0, img, false);
    makeTex(1, f1, false);
    makeTex(2, f2, false);
    makeTex(3, f3, false);
    makeTex(4, lab, true);
    makeTex(5, lab2, true);

    gl.useProgram(sceneProg);
    ["uImg", "uFill1", "uFill2", "uFill3", "uLab", "uLab2"].forEach((n, i) => gl.uniform1i(su[n], i));
    gl.uniform1f(su.uFocus, CONFIG.focus);
    gl.useProgram(compProg);
    gl.uniform1i(cu.uScene, SCENE_UNIT);
    gl.uniform1i(cu.uImg, 0);
    gl.uniform1f(cu.uFocus, CONFIG.focus);

    const regions = scene.regions;       // [a, b, c, u0, v0, u1, v1]
    const aspect = scene.width / scene.height;
    if (!resize()) throw new Error("Offscreen buffer not supported");

    let prev = performance.now();
    const frame = (now) => {
      const dt = Math.min((now - prev) / 1000, 0.05);
      prev = now;

      let tx = target.x, ty = target.y;
      if (CONFIG.idleDrift && !reduced && now - lastInput > 3500) {
        const t = now / 1000;
        tx = Math.sin(t * 0.23) * 0.45;
        ty = Math.sin(t * 0.17 + 1.3) * 0.25;
      }
      // Exponential easing: smooth, no overshoot.
      const k = 1 - Math.exp(-dt * 4.2);
      cur.x += (tx - cur.x) * k;
      cur.y += (ty - cur.y) * k;

      resize();
      const ra = canvas.width / canvas.height;
      const vx = zoom / (ra > aspect ? 1 : ra / aspect);
      const vy = zoom / (ra > aspect ? aspect / ra : 1);
      // Eye moves right -> near objects slide left, far landscape slides right.
      const ox = -cur.x * strength;
      const oy = -cur.y * strength * CONFIG.verticalRatio;

      // pass 1
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.viewport(0, 0, fboW, fboH);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LESS);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(sceneProg);
      gl.uniform2f(su.uView, vx, vy);
      gl.uniform2f(su.uOffset, ox, oy);
      for (let i = 0; i < regions.length; i++) {
        const r = regions[i];
        gl.uniform1f(su.uId, i + 1);
        gl.uniform3f(su.uPlane, r[0], r[1], r[2]);
        gl.uniform4f(su.uBox, r[3], r[4], r[5], r[6]);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      // pass 2
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.disable(gl.DEPTH_TEST);
      gl.useProgram(compProg);
      gl.uniform2f(cu.uTexel, 1 / fboW, 1 / fboH);
      gl.uniform2f(cu.uView, vx, vy);
      gl.uniform2f(cu.uOffset, ox, oy);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame((t) => {
      frame(t);
      canvas.classList.add("ready");
      loading.hidden = true;
    });
  }).catch((err) => {
    console.error(err);
    showFallback();
  });
})();
</script>

</body>
</html>
